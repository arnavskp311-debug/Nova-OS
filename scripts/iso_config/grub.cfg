set default="0"
set timeout=5

insmod font
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

menuentry "Nova OS Live (Default - Intel HD/UHD Graphics)" --class gnu-linux --class os {
    linux /boot/vmlinuz boot=live components quiet splash loglevel=0 vt.global_cursor_default=0
    initrd /boot/initrd.img
}

menuentry "Nova OS Live (Copy to RAM - Ultra Fast)" --class gnu-linux --class os {
    linux /boot/vmlinuz boot=live components quiet splash toram
    initrd /boot/initrd.img
}

menuentry "Nova OS Live (Safe Graphics / Nomodeset)" --class gnu-linux --class os {
    linux /boot/vmlinuz boot=live components quiet splash nomodeset
    initrd /boot/initrd.img
}

menuentry "Nova OS Live (Debug Console)" --class gnu-linux --class os {
    linux /boot/vmlinuz boot=live components systemd.debug_shell=1
    initrd /boot/initrd.img
}
