UI vesamenu.c32
PROMPT 0
TIMEOUT 50

MENU TITLE NOVA OS // Standalone Live Desktop (x86_64)
MENU COLOR title 1;36;44 #00d2e6 #060b18 none
MENU COLOR sel 7;37;40 #ffffff #0b1c3d none
MENU COLOR hotsel 1;36;44 #00d2e6 #0b1c3d none
MENU COLOR unsel 37;40 #8da2bb #060b18 none
MENU COLOR border 36;44 #00d2e6 #060b18 none

LABEL live
    MENU LABEL ^Nova OS Live (Default - Intel HD/UHD Graphics)
    MENU DEFAULT
    LINUX /boot/vmlinuz
    INITRD /boot/initrd.img
    APPEND boot=live components quiet splash loglevel=0 vt.global_cursor_default=0

LABEL live-toram
    MENU LABEL Nova OS Live (^Copy to RAM - Ultra Fast)
    LINUX /boot/vmlinuz
    INITRD /boot/initrd.img
    APPEND boot=live components quiet splash toram

LABEL live-nomodeset
    MENU LABEL Nova OS Live (^Safe Graphics / Nomodeset)
    LINUX /boot/vmlinuz
    INITRD /boot/initrd.img
    APPEND boot=live components quiet splash nomodeset

LABEL live-debug
    MENU LABEL Nova OS Live (^Debug Mode / Text Console)
    LINUX /boot/vmlinuz
    INITRD /boot/initrd.img
    APPEND boot=live components systemd.debug_shell=1
